name: "Runbook: errore durante l'analisi"
description: 'Run failed/aborted o step in errore (query, eccezione, AWS, Watchtower, timeout)'
title: '[Errore analisi] '
labels:
  - report/analysis-error
  - status/needs-triage
type: Bug
projects:
  - 'pagopa/26'
body:
  - type: markdown
    attributes:
      value: |
        La segnalazione entra in triage (`status/needs-triage`): il maintainer imposta Area/Domain/Priority
        e la collega al milestone competente. Le trace contengono identificativi di produzione: **oscurali** prima di allegarle.
  - type: input
    id: runbook
    attributes:
      label: 'Runbook key o alarm name'
      description: "La `key` di catalogo o l'`alarmName` (vedi `go-cli runbook list`)."
    validations:
      required: true
  - type: dropdown
    id: product
    attributes:
      label: 'Prodotto'
      options:
        - 'send'
        - 'interop'
        - 'go'
        - 'aws'
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 'Ambiente / account'
      description: "Es. `prod`, `uat`, oppure l'account id. Non il nome del profilo SSO."
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: 'Come è stata eseguita'
      options:
        - 'pnpm'
        - 'Lambda'
        - 'go-cli'
    validations:
      required: true
  - type: input
    id: window
    attributes:
      label: 'Finestra temporale o alarm-event id'
      description: "`--at` / `--to` usati, oppure l'alarm-event id di Watchtower."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 'Versione del runbook'
      description: "La riga `Runbook: <name> v<version>` all'inizio del log, oppure `runbook.version` in `result-*.json` / `execution.runbookVersion` in `trace-*.json`. Senza un run: `Version` in `go-cli runbook show <key>`."
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: 'Categoria'
      options:
        - 'Query Logs Insights / Athena'
        - 'Log group non trovato o non raggiungibile'
        - 'Credenziali / SSO / permessi AWS'
        - 'Eccezione del motore'
        - 'Watchtower API / token'
        - 'Timeout'
        - 'Altro'
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: 'Stato del run'
      options:
        - 'failed'
        - 'aborted'
        - 'completed con step in errore'
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: 'Id dello step in errore'
    validations:
      required: false
  - type: textarea
    id: error
    attributes:
      label: 'Messaggio di errore e stack'
      render: text
    validations:
      required: true
  - type: input
    id: cmd
    attributes:
      label: 'Riga di comando esatta'
      description: 'Senza token né profili con dati riservati.'
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 'Estratto di execution.log'
      render: text
    validations:
      required: false
  - type: dropdown
    id: repro
    attributes:
      label: 'Riproducibile?'
      options:
        - 'Sì'
        - 'No'
        - 'Non verificato'
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: 'Trace / result'
      description: "Incolla o allega `trace-*.json` / `result-*.json` da `data/go-analyze-alarm/outputs/<run>/`. Il campo `caseMatching.evaluations` mostra l'esito di ogni caso."
      render: json
    validations:
      required: false
  - type: checkboxes
    id: sanitized
    attributes:
      label: 'Dati sensibili'
      options:
        - label: 'Ho rimosso dati sensibili (codici fiscali, IUN, token)'
          required: true
