# Quality gates of every push and pull request on develop and main. Each check runs through bins/check.sh, as
# `pnpm check` does locally. "CI Success" is the required check:
# it fails unless every job it needs succeeded. Each job compiles what it needs: the build takes about
# 30 seconds, less than uploading and downloading it as an artifact.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on develop and main always complete, so
# every merged commit gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast checks that need no build. Each step runs even when an earlier one fails, so a single run
  # reports every broken check.
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:new-class-tests diffs the pull request against its base branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup CI environment
        id: setup
        uses: ./.github/actions/setup-ci
        with:
          install-args: --frozen-lockfile --ignore-scripts

      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bins/check.sh format

      - name: Unused code
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bins/check.sh unused

      - name: Dependency graph
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bins/check.sh dependencies

      # The verbose reporter of jscpd, so that a failure names the clones in the log.
      - name: Code duplication
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bins/check.sh duplicates

      - name: Type coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bins/check.sh types

      - name: Scaffold validation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bins/check.sh scaffold

      - name: New class tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bins/check.sh new-classes --base "origin/${BASE_REF}"

      - name: Workflows (actionlint)
        if: ${{ !cancelled() }}
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      # Security audit of the workflows; the deliberate exceptions are in .github/zizmor.yml.
      - name: Workflows (zizmor)
        if: ${{ !cancelled() }}
        uses: docker://ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
        env:
          # Online audits (known vulnerable actions, impostor commits) read the GitHub API.
          GH_TOKEN: ${{ github.token }}
        with:
          args: --no-progress .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci

      # CI=true: ESLint runs from scratch, without the local cache.
      - name: Lint
        run: bins/check.sh lint

  # Install scripts enabled: the tests of go-documents need the native build of better-sqlite3.
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci

      - name: Build
        id: build
        run: bins/check.sh build

      # Tests and coverage both run on a successful build, even when the other one fails.
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bins/check.sh test

      - name: Coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bins/check.sh coverage

  # Static gates of the published packages: publint, attw, API reports, import budgets and the
  # sensitive-data gate on the packed archives. No package is published without them.
  published:
    name: Published Packages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci
        with:
          install-args: --frozen-lockfile --ignore-scripts

      - name: Build
        run: bins/check.sh build

      - name: Publication gates
        env:
          # GitHub runners are about twice as slow as a workstation: only the time budgets are widened,
          # the checks on the loaded libraries stay the same.
          IMPORT_COST_TIME_FACTOR: '2'
        run: bins/check.sh published

  # The archives are packed once, on the toolchain Node, and every smoke cell installs those same
  # archives. `pnpm pack` runs each package's prepack (clean + build). The cells come from the declared
  # engines: each scenario runs on the minimum Node of the packages it installs and on 24, split into
  # three shards per Node version. See docs/PUBLISHED_PACKAGES_CHECKS.md.
  published-pack:
    name: Published Packages (pack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci
        with:
          install-args: --frozen-lockfile --ignore-scripts

      - name: Smoke matrix from the declared engines
        id: matrix
        run: echo "cells=$(pnpm -s check:published-packages --print-node-matrix --shards 3)" >> "$GITHUB_OUTPUT"

      - name: Pack the published packages
        run: pnpm -s check:published-packages --pack-to published-tarballs

      - name: Upload tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-tarballs
          path: published-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Installs the archives with npm and with isolated pnpm and engine-strict. The monorepo toolchain runs
  # on Node 24; the cell's Node then runs the consumer side (install, import, type check, bundle), so
  # the minimum versions are tested as consumers see them.
  published-smoke:
    name: Published Packages (Node ${{ matrix.node }}, ${{ matrix.shard }})
    needs: published-pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.published-pack.outputs.cells) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci
        with:
          install-args: --frozen-lockfile --ignore-scripts

      - name: Download tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-tarballs
          path: published-tarballs

      - name: Setup Node.js of the cell
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Smoke scenarios
        env:
          SCENARIOS: ${{ matrix.scenarios }}
        run: >-
          node --import tsx/esm bins/check-published-packages/src/index.ts
          --from-tarballs published-tarballs --scenario "$SCENARIOS"

  # The required check. A job added above must also be added to `needs`.
  ci-success:
    name: CI Success
    needs: [static, lint, test, published, published-pack, published-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          if [[ "$FAILED" == "true" ]]; then
            echo "One or more checks did not succeed."
            exit 1
          fi
          echo "All checks passed."
