name: CI

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

  merge_group:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/ci-job.yml
    with:
      command: lint

  format:
    name: Format Check
    uses: ./.github/workflows/ci-job.yml
    with:
      command: format:check
      install-args: --frozen-lockfile --ignore-scripts

  knip:
    name: Unused Code
    uses: ./.github/workflows/ci-job.yml
    with:
      command: knip
      install-args: --frozen-lockfile --ignore-scripts

  deps-check:
    name: Dependency Graph
    uses: ./.github/workflows/ci-job.yml
    with:
      command: deps:check
      install-args: --frozen-lockfile --ignore-scripts

  # Runs dup:report, not dup:check: both enforce the same threshold from
  # .jscpd.json, but the quiet reporter only prints the percentage, so a CI
  # failure would name no file. The verbose one lists every clone in the log.
  duplication:
    name: Code Duplication
    uses: ./.github/workflows/ci-job.yml
    with:
      command: dup:report
      install-args: --frozen-lockfile --ignore-scripts

  type-coverage:
    name: Type Coverage
    uses: ./.github/workflows/ci-job.yml
    with:
      command: type-coverage
      install-args: --frozen-lockfile --ignore-scripts

  scaffold:
    name: Scaffold Validation
    uses: ./.github/workflows/ci-job.yml
    with:
      command: validate:scaffold
      install-args: --frozen-lockfile --ignore-scripts

  new-class-tests:
    name: New Class Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci
        with:
          install-args: --frozen-lockfile --ignore-scripts

      - name: Test new class test checker
        run: pnpm check:new-class-tests:test

      - name: Check new class tests
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            base_ref="${{ github.event.merge_group.base_ref }}"
            base_ref="${base_ref#refs/heads/}"
          else
            base_ref="${{ github.base_ref }}"
          fi

          pnpm check:new-class-tests --base "origin/${base_ref}"

      - name: Skip outside pull requests
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: echo "New class test enforcement only runs on pull_request and merge_group events."

  build:
    name: Build
    uses: ./.github/workflows/ci-job.yml
    with:
      command: build
      install-args: --frozen-lockfile --ignore-scripts
      timeout-minutes: 25
      upload-artifact-name: workspace-build
      upload-artifact-path: |
        packages/**/dist
        packages/**/*.tsbuildinfo
        scripts/**/dist
        scripts/**/*.tsbuildinfo

  test:
    name: Test
    needs: build
    uses: ./.github/workflows/ci-job.yml
    with:
      command: test
      install-args: --frozen-lockfile
      timeout-minutes: 25
      download-artifact-name: workspace-build

  # Static gates of the published packages: publint, attw, API reports, import budgets and the
  # sensitive-data gate on the packed archives. No package is published without them.
  published:
    name: Published Packages
    needs: build
    uses: ./.github/workflows/ci-job.yml
    with:
      command: test:published:static
      install-args: --frozen-lockfile --ignore-scripts
      timeout-minutes: 25
      download-artifact-name: workspace-build
      # GitHub runners are about twice as slow as a workstation: only the time thresholds are widened,
      # the checks on the loaded libraries stay the same.
      import-cost-time-factor: '2'

  # §10.2: the archives are packed once on the toolchain Node (24) and reused by every cell of
  # the smoke matrix. The cells come from the declared engines: each scenario runs on the minimum
  # of the packages it installs and on 24 (`--print-node-matrix`).
  published-pack:
    name: Published Packages (pack)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci
        with:
          install-args: --frozen-lockfile --ignore-scripts

      - name: Download workspace build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workspace-build
          path: .

      - name: Node versions from the declared engines
        id: matrix
        run: echo "cells=$(pnpm -s check:published-packages --print-node-matrix)" >> "$GITHUB_OUTPUT"

      - name: Pack the published packages
        run: pnpm -s check:published-packages --pack-to published-tarballs

      - name: Upload tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-tarballs
          path: published-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 14

  # §10.2: scenarios S1-S8 from the tarballs, with npm and isolated pnpm and engine-strict. The
  # monorepo toolchain is installed on Node 24; the cell's Node then runs the consumer side
  # (install, import, type check, bundle), so the minimum versions are tested as consumers see them.
  published-smoke:
    name: Published Packages (Node ${{ matrix.node }})
    needs: published-pack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.published-pack.outputs.cells) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci
        with:
          install-args: --frozen-lockfile --ignore-scripts

      - name: Download tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-tarballs
          path: published-tarballs

      - name: Setup Node.js of the cell
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Smoke scenarios
        run: >-
          node --import tsx/esm bins/check-published-packages/src/index.ts
          --from-tarballs published-tarballs --scenario "${{ matrix.scenarios }}"

  coverage:
    name: Coverage
    needs: build
    uses: ./.github/workflows/ci-job.yml
    with:
      command: test:coverage
      install-args: --frozen-lockfile
      timeout-minutes: 25
      download-artifact-name: workspace-build
      upload-artifact-name: coverage-reports
      upload-artifact-path: |
        packages/**/coverage/lcov.info
        scripts/**/coverage/lcov.info
      coverage-lines-threshold: '90'
      coverage-branches-threshold: '80'
      coverage-functions-threshold: '90'

  macos-smoke:
    name: macOS Smoke
    uses: ./.github/workflows/ci-job.yml
    with:
      runner: macos-latest
      timeout-minutes: 25
      command: build:common
      install-args: --frozen-lockfile --ignore-scripts

  # Summary job for branch protection
  ci-success:
    name: CI Success
    needs:
      [
        lint,
        format,
        knip,
        deps-check,
        duplication,
        type-coverage,
        scaffold,
        new-class-tests,
        build,
        test,
        published,
        published-pack,
        published-smoke,
        coverage,
        macos-smoke,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results=("${{ needs.lint.result }}" "${{ needs.format.result }}" "${{ needs.knip.result }}" "${{ needs.deps-check.result }}" "${{ needs.duplication.result }}" "${{ needs.type-coverage.result }}" "${{ needs.scaffold.result }}" "${{ needs.new-class-tests.result }}" "${{ needs.build.result }}" "${{ needs.test.result }}" "${{ needs.published.result }}" "${{ needs.published-pack.result }}" "${{ needs.published-smoke.result }}" "${{ needs.coverage.result }}" "${{ needs.macos-smoke.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more checks failed"
              exit 1
            fi
          done
          echo "All checks passed!"
