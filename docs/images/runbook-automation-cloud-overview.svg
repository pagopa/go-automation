<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Runbook Automation — architettura cloud AWS</title>
  <desc id="desc">Gli allarmi CloudWatch degli account SEND e INTEROP inviano un messaggio alla coda SQS go-alarms-queue nell'account pn-analytics. La coda attiva la Lambda go-execute-runbook, che esegue il runbook associato all'allarme (se esiste) interrogando i log degli account sorgente tramite CloudWatch Cross-Account Observability. L'analisi prodotta viene salvata su Amazon RDS e consultata tramite Watchtower.</desc>
  <defs>
    <style>
      text { font-family: Inter, "SF Pro Text", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { fill: #111c33; font-size: 34px; font-weight: 700; letter-spacing: -0.6px; }
      .subtitle { fill: #5b6b82; font-size: 16px; }
      .panel-title { fill: #111c33; font-size: 20px; font-weight: 700; }
      .panel-sub { fill: #6b7a90; font-size: 13px; }
      .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 1px; }
      .name { fill: #111c33; font-size: 19px; font-weight: 700; }
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 17px; }
      .detail { fill: #5b6b82; font-size: 13.5px; }
      .chip { font-size: 12px; font-weight: 700; letter-spacing: 0.6px; }
      .edge { font-size: 12.5px; font-weight: 600; }
      .step-title { fill: #111c33; font-size: 14px; font-weight: 700; }
      .step-detail { fill: #5b6b82; font-size: 12.5px; }
      .num { fill: #fff; font-size: 13px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1b2b4a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-alarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d6453d"/></marker>
    <marker id="arr-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f5fd0"/></marker>
    <marker id="arr-logs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#12877f"/></marker>
  </defs>

  <!-- Sfondo e intestazione -->
  <rect width="1600" height="920" fill="#f6f8fb"/>
  <text x="48" y="72" class="title">Runbook Automation</text>
  <text x="48" y="102" class="subtitle">Architettura cloud AWS — dall'allarme CloudWatch all'analisi consultabile su Watchtower</text>

  <!-- ============ Account sorgenti (SEND / INTEROP) ============ -->
  <rect x="48" y="146" width="400" height="614" rx="20" fill="#eef3fb" stroke="#b8c8e3" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="74" y="184" class="panel-title">Account sorgenti</text>
  <text x="74" y="206" class="panel-sub">Tutti gli ambienti di SEND e INTEROP</text>
  <rect x="74" y="220" width="70" height="24" rx="12" fill="#dde7f8"/>
  <text x="109" y="236" text-anchor="middle" class="chip" fill="#2f5fd0">SEND</text>
  <rect x="152" y="220" width="86" height="24" rx="12" fill="#dde7f8"/>
  <text x="195" y="236" text-anchor="middle" class="chip" fill="#2f5fd0">INTEROP</text>

  <!-- CloudWatch Alarms -->
  <g filter="url(#shadow)"><rect x="76" y="265" width="344" height="140" rx="16" fill="#fff" stroke="#dde3ec"/></g>
  <rect x="96" y="285" width="44" height="44" rx="11" fill="#d6453d"/>
  <g transform="translate(118 307)" fill="#fff">
    <path d="M-9 5 C-9 -4 -6 -10 0 -10 C6 -10 9 -4 9 5 L11 8 H-11 Z"/>
    <circle cx="0" cy="11" r="2.6"/>
  </g>
  <text x="156" y="302" class="eyebrow" fill="#c0392f">AMAZON CLOUDWATCH</text>
  <text x="156" y="326" class="name">Alarms</text>
  <text x="96" y="364" class="detail">Allo scattare dell'allarme viene inviato</text>
  <text x="96" y="384" class="detail">un messaggio verso pn-analytics</text>

  <!-- CloudWatch Logs -->
  <g filter="url(#shadow)"><rect x="76" y="555" width="344" height="140" rx="16" fill="#fff" stroke="#dde3ec"/></g>
  <rect x="96" y="575" width="44" height="44" rx="11" fill="#12877f"/>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round">
    <line x1="107" y1="588" x2="129" y2="588"/>
    <line x1="107" y1="597" x2="125" y2="597"/>
    <line x1="107" y1="606" x2="129" y2="606"/>
  </g>
  <text x="156" y="592" class="eyebrow" fill="#0f766f">AMAZON CLOUDWATCH</text>
  <text x="156" y="616" class="name">Logs</text>
  <text x="96" y="654" class="detail">Log applicativi dei microservizi,</text>
  <text x="96" y="674" class="detail">condivisi tramite OAM link</text>

  <text x="248" y="740" text-anchor="middle" class="panel-sub">× N account / ambienti</text>

  <!-- ============ Account pn-analytics ============ -->
  <rect x="500" y="146" width="1052" height="614" rx="20" fill="#fff" stroke="#f0c36d" stroke-width="2"/>
  <path d="M520 146 H1532 A20 20 0 0 1 1552 166 V222 H500 V166 A20 20 0 0 1 520 146 Z" fill="#fff6e3"/>
  <line x1="500" y1="222" x2="1552" y2="222" stroke="#f5dcaa"/>
  <text x="526" y="184" class="panel-title">pn-analytics</text>
  <text x="526" y="206" class="panel-sub">Account GO · CloudWatch monitoring account</text>
  <rect x="1402" y="172" width="124" height="26" rx="13" fill="#fde8bf"/>
  <text x="1464" y="189" text-anchor="middle" class="chip" fill="#9a5b00">ACCOUNT GO</text>

  <!-- SQS -->
  <g filter="url(#shadow)"><rect x="540" y="265" width="260" height="140" rx="16" fill="#fff" stroke="#dde3ec"/></g>
  <rect x="560" y="285" width="44" height="44" rx="11" fill="#c7317a"/>
  <g fill="#fff">
    <rect x="569" y="299" width="7" height="16" rx="2"/>
    <rect x="579" y="299" width="7" height="16" rx="2"/>
    <rect x="589" y="299" width="7" height="16" rx="2" opacity="0.6"/>
  </g>
  <text x="620" y="302" class="eyebrow" fill="#a8235f">AMAZON SQS</text>
  <text x="620" y="327" class="mono" fill="#111c33" font-weight="700">go-alarms-queue</text>
  <text x="560" y="364" class="detail">Riceve i messaggi di allarme</text>
  <text x="560" y="384" class="detail">da tutti gli account sorgenti</text>

  <!-- Lambda -->
  <g filter="url(#shadow)"><rect x="880" y="265" width="280" height="140" rx="16" fill="#fff" stroke="#dde3ec"/></g>
  <rect x="900" y="285" width="44" height="44" rx="11" fill="#e07b00"/>
  <text x="922" y="317" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">λ</text>
  <text x="960" y="302" class="eyebrow" fill="#b35f00">AWS LAMBDA</text>
  <text x="960" y="327" class="mono" fill="#111c33" font-weight="700">go-execute-runbook</text>
  <text x="900" y="364" class="detail">Esegue il runbook associato</text>
  <text x="900" y="384" class="detail">all'allarme, se esiste</text>

  <!-- RDS -->
  <g filter="url(#shadow)"><rect x="1240" y="265" width="280" height="140" rx="16" fill="#fff" stroke="#dde3ec"/></g>
  <rect x="1260" y="285" width="44" height="44" rx="11" fill="#4f55d6"/>
  <g fill="none" stroke="#fff" stroke-width="2.6">
    <ellipse cx="1282" cy="298" rx="11" ry="4"/>
    <path d="M1271 298 V316 C1271 321 1293 321 1293 316 V298"/>
    <path d="M1271 307 C1271 312 1293 312 1293 307"/>
  </g>
  <text x="1320" y="302" class="eyebrow" fill="#3d42b8">AMAZON RDS</text>
  <text x="1320" y="326" class="name">Database</text>
  <text x="1260" y="364" class="detail">Memorizza le analisi prodotte</text>
  <text x="1260" y="384" class="detail">dall'esecuzione dei runbook</text>

  <!-- CloudWatch Cross-Account Observability -->
  <g filter="url(#shadow)"><rect x="820" y="555" width="400" height="140" rx="16" fill="#effaf8" stroke="#a6dcd6"/></g>
  <rect x="840" y="575" width="44" height="44" rx="11" fill="#12877f"/>
  <g fill="none" stroke="#fff" stroke-width="2.6">
    <path d="M849 597 C854 588 870 588 875 597 C870 606 854 606 849 597 Z"/>
    <circle cx="862" cy="597" r="3.6" fill="#fff"/>
  </g>
  <text x="900" y="592" class="eyebrow" fill="#0f766f">AMAZON CLOUDWATCH · OAM</text>
  <text x="900" y="616" class="name">Cross-Account Observability</text>
  <text x="840" y="654" class="detail">Rende interrogabili da pn-analytics i log</text>
  <text x="840" y="674" class="detail">di tutti gli account sorgenti collegati</text>

  <!-- Watchtower -->
  <g filter="url(#shadow)"><rect x="1240" y="555" width="280" height="140" rx="16" fill="#fff" stroke="#dde3ec"/></g>
  <rect x="1260" y="575" width="44" height="44" rx="11" fill="#1f2a44"/>
  <g fill="#fff">
    <rect x="1270" y="601" width="6" height="10" rx="1.5"/>
    <rect x="1279" y="593" width="6" height="18" rx="1.5"/>
    <rect x="1288" y="585" width="6" height="26" rx="1.5"/>
  </g>
  <text x="1320" y="592" class="eyebrow" fill="#44506a">APPLICAZIONE WEB</text>
  <text x="1320" y="616" class="name">Watchtower</text>
  <text x="1260" y="654" class="detail">Consultazione delle analisi</text>
  <text x="1260" y="674" class="detail">da parte del team GO</text>

  <!-- ============ Collegamenti ============ -->
  <!-- 1. Allarme -> SQS -->
  <line x1="420" y1="335" x2="538" y2="335" stroke="#d6453d" stroke-width="2.6" marker-end="url(#arr-alarm)"/>
  <circle cx="479" cy="335" r="12" fill="#d6453d"/>
  <text x="479" y="340" text-anchor="middle" class="num">1</text>
  <text x="479" y="316" text-anchor="middle" class="edge" fill="#c0392f">allarme</text>

  <!-- 2. SQS -> Lambda -->
  <line x1="800" y1="335" x2="878" y2="335" stroke="#2f5fd0" stroke-width="2.6" marker-end="url(#arr-flow)"/>
  <circle cx="839" cy="335" r="12" fill="#2f5fd0"/>
  <text x="839" y="340" text-anchor="middle" class="num">2</text>
  <text x="839" y="316" text-anchor="middle" class="edge" fill="#2f5fd0">trigger</text>

  <!-- Log condivisi -> OAM -->
  <line x1="420" y1="625" x2="818" y2="625" stroke="#12877f" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arr-logs)"/>
  <rect x="540" y="611" width="206" height="28" rx="14" fill="#fff" stroke="#a6dcd6"/>
  <text x="643" y="630" text-anchor="middle" class="edge" fill="#0f766f">log condivisi cross-account</text>

  <!-- 3. Lambda -> OAM -->
  <line x1="1020" y1="405" x2="1020" y2="553" stroke="#12877f" stroke-width="2.6" marker-end="url(#arr-logs)"/>
  <circle cx="1020" cy="480" r="12" fill="#12877f"/>
  <text x="1020" y="485" text-anchor="middle" class="num">3</text>
  <text x="1042" y="476" class="edge" fill="#0f766f">interroga i log</text>
  <text x="1042" y="494" class="edge" fill="#0f766f">dell'ambiente in allarme</text>

  <!-- 4. Lambda -> RDS -->
  <line x1="1160" y1="335" x2="1238" y2="335" stroke="#2f5fd0" stroke-width="2.6" marker-end="url(#arr-flow)"/>
  <circle cx="1199" cy="335" r="12" fill="#2f5fd0"/>
  <text x="1199" y="340" text-anchor="middle" class="num">4</text>
  <text x="1199" y="316" text-anchor="middle" class="edge" fill="#2f5fd0">salva</text>

  <!-- 5. RDS -> Watchtower -->
  <line x1="1380" y1="405" x2="1380" y2="553" stroke="#2f5fd0" stroke-width="2.6" marker-end="url(#arr-flow)"/>
  <circle cx="1380" cy="480" r="12" fill="#2f5fd0"/>
  <text x="1380" y="485" text-anchor="middle" class="num">5</text>
  <text x="1402" y="485" class="edge" fill="#2f5fd0">consultazione</text>

  <!-- ============ Legenda dei passi ============ -->
  <g transform="translate(48 800)">
    <circle cx="12" cy="12" r="12" fill="#d6453d"/><text x="12" y="17" text-anchor="middle" class="num">1</text>
    <text x="34" y="10" class="step-title">Allarme</text>
    <text x="34" y="30" class="step-detail">CloudWatch invia un messaggio</text>
    <text x="34" y="48" class="step-detail">su go-alarms-queue</text>

    <circle cx="316" cy="12" r="12" fill="#2f5fd0"/><text x="316" y="17" text-anchor="middle" class="num">2</text>
    <text x="338" y="10" class="step-title">Trigger</text>
    <text x="338" y="30" class="step-detail">La coda attiva la Lambda</text>
    <text x="338" y="48" class="step-detail">go-execute-runbook</text>

    <circle cx="620" cy="12" r="12" fill="#12877f"/><text x="620" y="17" text-anchor="middle" class="num">3</text>
    <text x="642" y="10" class="step-title">Esecuzione del runbook</text>
    <text x="642" y="30" class="step-detail">Analisi dei log dell'ambiente sorgente</text>
    <text x="642" y="48" class="step-detail">via Cross-Account Observability</text>

    <circle cx="924" cy="12" r="12" fill="#2f5fd0"/><text x="924" y="17" text-anchor="middle" class="num">4</text>
    <text x="946" y="10" class="step-title">Persistenza</text>
    <text x="946" y="30" class="step-detail">L'analisi viene salvata</text>
    <text x="946" y="48" class="step-detail">sul database RDS</text>

    <circle cx="1228" cy="12" r="12" fill="#2f5fd0"/><text x="1228" y="17" text-anchor="middle" class="num">5</text>
    <text x="1250" y="10" class="step-title">Consultazione</text>
    <text x="1250" y="30" class="step-detail">Il team GO consulta l'analisi</text>
    <text x="1250" y="48" class="step-detail">tramite Watchtower</text>
  </g>
</svg>
